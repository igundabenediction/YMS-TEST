<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Inscription VIP | YMS STORE</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/abonnement.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>


<body>


<header class="vip-header">


<div class="container header-container">


<a href="index.html" class="vip-logo">


<img 
src="assets/image/IMG_3474.PNG"
alt="YMS STORE">


<span>
YMS STORE VIP
</span>


</a>


</div>


</header>





<section class="vip-hero">


<div class="container">



<div class="section-title">


<span>
Création compte VIP
</span>


<h2>
Rejoignez le Club Premium
</h2>


<p>
Créez votre compte membre pour accéder aux avantages YMS STORE.
</p>


</div>







<div class="plan-card register-box">


<div class="form-header">


<h2>

<i class="fa-solid fa-crown"></i>

Créer mon compte VIP

</h2>


<p>
Accédez aux avantages exclusifs YMS STORE
</p>


</div>






<form id="vipRegisterForm">






<label>
Nom complet
</label>


<input 
type="text"
id="name"
placeholder="Votre nom complet"
required>


<label>
Téléphone WhatsApp
</label>


<input 
type="tel"
id="phone"
placeholder="+243..."
required>


<label>
Adresse
</label>


<input 
type="text"
id="address"
placeholder="Votre adresse"
required>







<label>
Photo de profil
</label>


<input 
type="file"
id="photo"
accept="image/*"
required>




<img 
id="previewPhoto"
src="assets/image/default-user.png"
class="preview-photo"
alt="Aperçu photo">







<label>
Choisir abonnement
</label>



<select id="plan" required>


<option value="">
Sélectionner une formule
</option>


<option value="silver">
Silver VIP - 5$/mois
</option>


<option value="gold">
Gold VIP - 10$/mois
</option>


<option value="platinum">
Platinum VIP - 20$/mois
</option>


</select>







<button 
type="submit"
class="vip-btn">


<i class="fa-solid fa-credit-card"></i>


Continuer vers paiement


</button>





</form>




</div>



</div>


</section>





<script src="js/register-vip.js"></script>



</body>

</html>
