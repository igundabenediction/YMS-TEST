<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paiement VIP | YMS STORE</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="css/abonnement.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>


<body>



<header class="vip-header">

<div class="container header-container">


<a href="index.html" class="vip-logo">

<img src="assets/image/IMG_3474.PNG">

<span>
YMS STORE VIP
</span>

</a>


</div>

</header>




<section class="vip-hero">


<div class="container">



<div class="section-title">

<span>
Paiement abonnement
</span>


<h2>
Finalisez votre inscription VIP
</h2>


<p>
Effectuez votre paiement puis envoyez votre preuve.
</p>


</div>






<div class="plan-card"
style="max-width:650px;margin:auto;">



<div id="memberInfo">


</div>




<h3>
Modes de paiement
</h3>



<div class="member-card">


<h3>
<i class="fa-solid fa-mobile-screen"></i>
M-Pesa
</h3>


<p>
Numéro paiement :
<strong>
+243 XXX XXX XXX
</strong>
</p>


</div>





<div class="member-card">


<h3>
<i class="fa-solid fa-mobile-screen"></i>
Airtel Money
</h3>


<p>
Numéro paiement :
<strong>
+243 XXX XXX XXX
</strong>
</p>


</div>






<form id="paymentForm">



<label>
Nom de l'expéditeur
</label>


<input 
type="text"
id="payer"
placeholder="Nom utilisé pour le paiement"
required>





<label>
Référence transaction
</label>


<input 
type="text"
id="reference"
placeholder="Code transaction"
required>






<label>
Capture preuve paiement
</label>


<input 
type="file"
id="proof"
accept="image/*">






<button class="plan-btn"
type="submit">


<i class="fa-solid fa-check"></i>

Confirmer paiement


</button>



</form>



</div>



</div>


</section>





<script src="js/paiement.js"></script>
<script src="../js/auth-vip.js"></script>
</body>


</html>
