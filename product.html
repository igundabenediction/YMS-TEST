<!DOCTYPE html>

<html lang="fr">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Produit | YMS STORE</title>


<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="css/header.css">

<link rel="stylesheet" href="css/product-page.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>



<body>


<!-- HEADER -->

<header class="main-header">


<div class="container header-container">


<a href="index.html" class="logo">

<img src="images/logo.png" alt="YMS STORE">

</a>



<div class="search-box">

<input type="text"
placeholder="Rechercher un produit...">


<button>

<i class="fa-solid fa-search"></i>

</button>

</div>



<div class="header-actions">


<a class="header-icon">

<i class="fa-regular fa-heart"></i>

</a>


<a class="header-icon cart">

<i class="fa-solid fa-cart-shopping"></i>

<span>0</span>

</a>


</div>


</div>


</header>





<!-- PRODUCT DETAILS -->


<section class="product-details">


<div class="container product-layout">



<!-- GALERIE -->


<div class="product-gallery">


<div class="main-image">


<img src="images/products/product1.jpg"
id="mainProductImage"
alt="Produit">


</div>




<div class="thumbs">


<img src="images/products/product1.jpg">


<img src="images/products/product2.jpg">


<img src="images/products/product3.jpg">


</div>



</div>







<!-- INFORMATIONS -->


<div class="product-info-page">


<span class="product-category">

Chaussures Premium

</span>



<h1>

Sneakers Premium Luxe

</h1>



<div class="rating">

★★★★★

<span>(45 avis)</span>

</div>




<div class="product-price">


<span class="current-price">

65$

</span>


<span class="old-price">

80$

</span>


</div>




<p>

Une paire de sneakers élégante,
confortable et adaptée au style moderne.

</p>






<div class="options">


<h3>Taille</h3>


<div class="sizes">


<button>40</button>

<button>41</button>

<button>42</button>

<button>43</button>


</div>


</div>








<div class="quantity">


<button id="minus">

-

</button>



<input id="quantity"
value="1">



<button id="plus">

+

</button>


</div>







<button class="add-product-cart">


Ajouter au panier

<i class="fa-solid fa-cart-shopping"></i>


</button>





<a class="whatsapp-order">

Commander via WhatsApp

</a>



</div>




</div>


</section>






<script src="js/product-page.js"></script>


</body>


</html>
